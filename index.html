
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Monitoreo de Calidad del Agua</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f6f9;
      color: #203c4b;
      text-align: center;
      margin: 0;
    }

    header {
      background: #126b83;
      color: white;
      padding: 35px;
    }

    main {
      padding: 30px;
    }

    .panel {
      background: white;
      padding: 25px;
      border-radius: 12px;
      max-width: 650px;
      margin: 20px auto;
      box-shadow: 0 3px 12px #00000015;
    }
  </style>
</head>

<body>
  <header>
    <h1>Sistema IoT de Calidad del Agua</h1>
    <p>Monitoreo y clasificación de muestras de agua</p>
  </header>

  <main>
    <div class="panel">
      <h2>Bienvenido</h2>
      <p>
        Plataforma de monitoreo de calidad del agua
        mediante sensores conectados a una Raspberry Pi 3.
      </p>
    </div>

    <div class="panel">
      <h2>Variables monitoreadas</h2>
      <p>pH | Turbidez | Conductividad</p>
      <p>Próximamente: datos y gráficas en tiempo real.</p>
    </div>
  </main>
</body>
</html>
